services:
  cda1tenth:
    build: .
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/cda_bags:/root/cda_bags
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      ros2 launch cda1tenth_bringup cda1tenth_bringup_launch.xml
        vehicle:=${VEHICLE:-turtlebot}
        record_bag:=${RECORD_BAG:-false}
